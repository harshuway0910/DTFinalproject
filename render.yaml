services:
  # 1. Backend Flask API
  - type: web
    name: footprint-fighter-backend
    runtime: python
    rootDir: DT1/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GEMINI_API_KEY
        sync: false

  # 2. Frontend React Vite Static Site
  - type: web
    name: footprint-fighter-frontend
    runtime: static
    rootDir: DT1/frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
